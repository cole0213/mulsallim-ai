<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물살림 AI | 내 지역 물 상황</title><link rel="stylesheet" href="mulsallim-action.css"></head><body><div id="app"></div><script>
(async()=>{let raw=await fetch('mulsallim-action.html').then(r=>r.text());raw=raw.replace('href="mulsallim.html"','href="mulsallim-user-ux-final.html"');const parsed=new DOMParser().parseFromString(raw,'text/html');document.getElementById('app').innerHTML=parsed.body.innerHTML;const base=document.createElement('script');base.src='mulsallim-action.js';base.onload=()=>{const q=new URLSearchParams(location.search),code=q.get('code'),name=q.get('name'),place=q.get('place'),p=q.get('province'),c=q.get('city');for(const src of ['mulsallim-service-ux.js','mulsallim-revisit.js']){const x=document.createElement('script');x.src=src;document.body.append(x)}if(code&&name&&place){load({code,name,place});return}if(p&&c){document.querySelector('#province').value=p;document.querySelector('#province').dispatchEvent(new Event('change'));document.querySelector('#city').value=c;document.querySelector('#searchBtn').click()}};document.body.append(base)})().catch(e=>document.getElementById('app').textContent='대시보드를 불러오지 못했습니다: '+e.message);
</script></body></html>
