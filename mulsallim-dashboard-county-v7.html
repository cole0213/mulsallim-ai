<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물살림 AI | 우리 지역 저수율 확인</title><link rel="stylesheet" href="mulsallim-action.css"></head><body><div id="app"></div><script>
(async()=>{let raw=await fetch('mulsallim-action.html').then(r=>r.text());raw=raw.replace('href="mulsallim.html"','href="mulsallim-public-county-v7.html"');const parsed=new DOMParser().parseFromString(raw,'text/html');document.getElementById('app').innerHTML=parsed.body.innerHTML;const base=document.createElement('script');base.src='mulsallim-action.js';base.onload=()=>{for(const src of ['mulsallim-service-ux.js','mulsallim-revisit.js','mulsallim-practice.js','mulsallim-accessibility.js','mulsallim-collaboration.js','mulsallim-ai-governance.js']){const x=document.createElement('script');x.src=src;document.body.append(x)}const region=document.createElement('script');region.src='mulsallim-regions-county-v3.js';region.onload=async()=>{const q=new URLSearchParams(location.search),code=q.get('code'),name=q.get('name'),place=q.get('place'),p=q.get('province'),c=q.get('city');if(code&&name&&place){load({code,name,place});return}if(p&&c){document.querySelector('#province').value=p;const cities=await window.mulsallimLoadCountyCities(p);if(cities.includes(c)){document.querySelector('#city').value=c;document.querySelector('#searchBtn').click()}else{document.querySelector('#searchMsg').textContent='선택한 시·군·구에는 최근 KRC 관리 저수지 관측값이 없습니다.'}}};document.body.append(region)};document.body.append(base)})().catch(e=>document.getElementById('app').textContent='서비스를 불러오지 못했습니다. '+e.message);
</script></body></html>
