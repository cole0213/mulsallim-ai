</style></head><body><header class="top">물살림 <b>AI</b> · 파일럿</header><main class="page"><section class="panel"><p class="eyebrow">PILOT EVIDENCE · ANONYMOUS</p><h1>사용 경험을 숫자로 검증합니다.</h1><p class="muted">이 설문은 파일럿 참여자의 서비스 이해·편의·재사용 의향을 익명으로 기록합니다. 이름, 연락처, 정확한 농지 주소는 입력하지 마세요. 응답은 90일 뒤 자동 삭제됩니다.</p></section><section class="panel"><h2>현재 파일럿 지표</h2><div id="metrics" class="grid"><p class="muted">지표를 불러오는 중입니다.</p></div></section><section class="panel"><h2>3분 피드백</h2><form id="form"><label>참여 역할<select name="role"><option value="farmer">농업인·수리계</option><option value="field">KRC·현장 담당자</option><option value="localgov">지자체 담당자</option><option value="other">기타</option></select></label><div id="questions"></div><label>개선 의견 <small class="muted">선택 · 개인정보 제외 · 최대 400자</small><textarea name="comment" maxlength="400" placeholder="예: 지역 선택은 쉬웠지만 다음 확인 항목에 실제 담당 창구 안내가 있으면 좋겠습니다."></textarea></label><button type="submit">익명 피드백 저장</button><p id="state" class="muted" role="status"></p></form></section><section class="panel"><p class="notice"><b>운영 원칙:</b> 이 화면의 결과는 실제 파일럿에서만 사용합니다. 응답이 없거나 적으면 성과처럼 표현하지 않으며, 집계값만 발표 자료에 활용합니다.</p><p class="muted"><a href="mulsallim-public-county-v12.html">내 지역 확인으로 돌아가기</a></p></section></main><script src="mulsallim-pilot.js"></script></body></html>
