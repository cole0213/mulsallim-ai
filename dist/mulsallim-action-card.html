<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물살림 AI | 현장 확인 카드</title><style>:root{--deep:#104641;--teal:#087a77;--line:#c8ded5;--paper:#f4f8f6;--muted:#58716c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#153e3b;font:16px system-ui,'Malgun Gothic',sans-serif}.top{height:66px;background:var(--deep);color:#fff;display:flex;align-items:center;padding:0 max(20px,calc((100% - 760px)/2));font-weight:900;font-size:21px}.top b{color:#a9dec9}.box{max-width:760px;margin:42px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);padding:30px}.eyebrow{font-weight:900;font-size:11px;letter-spacing:.13em;color:var(--teal);margin:0 0 8px}h1{font-size:31px;letter-spacing:-.06em;margin:0 0 10px}.meta{color:var(--muted);font-size:13px}.status{display:inline-block;padding:6px 9px;background:#e4f2ec;color:#176259;font-weight:800;font-size:12px;margin:18px 0}.block{border-top:1px solid #d9e8e2;padding:17px 0}.block b,.block span{display:block}.block span{line-height:1.65;margin-top:6px}.note{background:#f3f8f5;padding:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.buttons button,.buttons a{border:1px solid #b7d6ca;background:#fff;padding:10px 12px;color:#164a45;font:inherit;font-weight:800;text-decoration:none}.buttons button.active{background:var(--deep);color:#fff}.muted{color:var(--muted);font-size:13px;line-height:1.65}.error{color:#9d3832}</style></head><body><header class="top">물살림 <b>AI</b></header><main class="box"><section id="app" class="card"><p class="muted">확인 카드를 불러오는 중입니다.</p></section></main><script src="mulsallim-action-card.js"></script></body></html>
